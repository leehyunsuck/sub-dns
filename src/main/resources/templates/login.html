<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('로그인', false)}">
    <meta charset="UTF-8">
    <title>로그인</title>
    <link rel="stylesheet" href="../static/ObS/css/style.css" th:href="|${staticUrl}css/style.css|">
</head>
<body>
    <header th:replace="~{fragments/layout :: header}"></header>

    <main id="content">
        <h2>로그인</h2>
        <div class="login-info">
            <p>소셜 로그인을 통해 모든 기능을 이용할 수 있습니다.</p>
            <p>가입되지 않은 소셜 계정일 경우 회원가입 페이지로 전환됩니다.</p>
            <p>오로직 소셜 로그인 플랫폼 명칭과 고유번호만 저장합니다.</p>
        </div>

        <button id="githubLoginBtn" onclick="loginWithGitHub()">
            <img id="githubIcon" class="github-icon" src="../static/ObS/assets/github-mark.svg" th:src="|${staticUrl}assets/github-mark.svg|" alt="GitHub Logo">
            GitHub 계정으로 로그인
        </button>


    </main>

    <div th:replace="~{fragments/layout :: footer}"></div>
    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
